name: e2e

# The real proof: take a disposable Windows Server runner, harden it FOR REAL,
# run the script again to prove idempotence, then verify every promise and
# score the box. Linting checks the script parses; this checks it hardens.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harden-and-verify:
    name: Harden a disposable Windows node + verify
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Show the starting posture (this is what we are fixing)
        shell: powershell
        run: |
          "OS: $((Get-CimInstance Win32_OperatingSystem).Caption)"
          "SMB RequireSecuritySignature: $((Get-SmbServerConfiguration).RequireSecuritySignature)"
          Get-NetFirewallProfile | ForEach-Object { "firewall $($_.Name): inbound=$($_.DefaultInboundAction)" }
          (net accounts) | Select-String 'Minimum password length|history'
          $rdp = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          "RDP fDenyTSConnections: $((Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -ErrorAction SilentlyContinue).fDenyTSConnections)"
          foreach ($n in 'UserAuthentication','SecurityLayer','MinEncryptionLevel') {
            "RDP ${n}: $((Get-ItemProperty $rdp -Name $n -ErrorAction SilentlyContinue).$n)"
          }
          "audit policy as shipped (last CSV column is Setting Value: 0=none 1=success 2=failure 3=both):"
          $csv = "$env:TEMP\posture-audit.csv"
          auditpol /backup /file:$csv | Out-Null
          Get-Content $csv | Select-String '0cce9215|0cce922b|0cce922f'
          Remove-Item $csv
          "Defender PUAProtection as shipped (0=off 1=block 2=audit): $((Get-MpPreference).PUAProtection)"
          "SMB1 as shipped: server EnableSMB1Protocol=$((Get-SmbServerConfiguration).EnableSMB1Protocol) mrxsmb10=$(if (Get-Service mrxsmb10 -ErrorAction SilentlyContinue) { (Get-Service mrxsmb10).StartType } else { 'absent' }) feature=$((Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction SilentlyContinue).State)"
          Get-Service Spooler, RemoteRegistry -ErrorAction SilentlyContinue |
            ForEach-Object { "service $($_.Name): $($_.Status)/$($_.StartType)" }

      # Most offenders here are NATURAL: the runner ships SMB signing off,
      # LLMNR/NetBIOS enabled, no PowerShell logging, password length 0. Two
      # knobs already hold a good value, so plant the bad one to prove the
      # step does the work instead of confirming a default (the tautology trap
      # the Linux siblings' step 30 taught us).
      - name: Plant the offenders that would otherwise be tautological
        shell: powershell
        run: |
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name NoLMHash `
            -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' `
            -Name UseLogonCredential -Value 1 -PropertyType DWord -Force | Out-Null
          "planted NoLMHash=0 and WDigest UseLogonCredential=1"
          # Measured: the Azure-built runner image ships RDP ACCEPTING
          # connections (fDenyTSConnections=0) with all three knobs already at
          # target (NLA=1, SecurityLayer=2, MinEncryptionLevel=3) - without
          # planting, the RDP step would be 100% tautological. Plant all three
          # weak; the posture step above logs what the image shipped.
          $rdp = 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'
          New-ItemProperty -Path $rdp -Name UserAuthentication -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $rdp -Name SecurityLayer -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $rdp -Name MinEncryptionLevel -Value 2 -PropertyType DWord -Force | Out-Null
          "planted RDP UserAuthentication=0, SecurityLayer=1, MinEncryptionLevel=2"
          # Measured: the image ships Logon = Success and Failure (3) and
          # Process Creation = Success (1) already - without planting, most of
          # the audit-policy step would be tautological. Plant No Auditing on
          # all three; the posture step above logs what the image shipped.
          foreach ($g in '{0CCE9215-69AE-11D9-BED3-505054503030}',
                         '{0CCE922B-69AE-11D9-BED3-505054503030}',
                         '{0CCE922F-69AE-11D9-BED3-505054503030}') {
            auditpol /set /subcategory:"$g" /success:disable /failure:disable | Out-Null
          }
          "planted the three audit subcategories to No Auditing"
          # AutoRun: plant the CLASSIC weak default (0x91 leaves CD-ROM and
          # removable bits clear) so the step provably tightens it to 0xFF -
          # the value ships ABSENT on the image, and absent would already be
          # real work, but a planted wrong value proves the overwrite too.
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer' `
            -Name NoDriveTypeAutoRun -Value 0x91 -PropertyType DWord -Force | Out-Null
          "planted NoDriveTypeAutoRun=0x91"
          # Attack-surface services: whatever the image ships (the posture
          # step above logs it), plant BOTH running with StartType Automatic
          # so the service step provably stops and disables real work instead
          # of confirming an image default.
          foreach ($n in 'Spooler', 'RemoteRegistry') {
            Set-Service -Name $n -StartupType Automatic
            Start-Service -Name $n
          }
          Get-Service Spooler, RemoteRegistry |
            ForEach-Object { "planted $($_.Name): $($_.Status)/$($_.StartType)" }
          # Null sessions: a modern image ships RestrictAnonymousSAM=1 and the
          # rest absent - absence is a default, not a planted weakness, so the
          # step would be half tautological. Plant the WHOLE family weak
          # (including two legacy null-session pipes) so step 12 provably
          # shuts every door instead of confirming an image default.
          $lsa = 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'
          $srv = 'HKLM:\SYSTEM\CurrentControlSet\Services\LanmanServer\Parameters'
          New-ItemProperty -Path $lsa -Name RestrictAnonymousSAM -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $lsa -Name RestrictAnonymous -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $lsa -Name EveryoneIncludesAnonymous -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $srv -Name RestrictNullSessAccess -Value 0 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $srv -Name NullSessionPipes -Value @('browser', 'srvsvc') -PropertyType MultiString -Force | Out-Null
          "planted the null-session family weak (RestrictAnonymous* 0, Everyone includes Anonymous, browser+srvsvc null pipes)"
          # SMB1: a modern image ships the server dialect OFF (and the driver
          # and feature absent) - absence is a default, not a planted weakness.
          # Plant the server flag on so step 14 provably shuts the door; the
          # other two doors are asserted as absent by verify.
          Set-SmbServerConfiguration -EnableSMB1Protocol $true -Confirm:$false -Force
          "planted SMB1 server dialect: EnableSMB1Protocol=$((Get-SmbServerConfiguration).EnableSMB1Protocol)"

      - name: Dry run changes nothing
        shell: powershell
        run: |
          $before = (Get-SmbServerConfiguration).RequireSecuritySignature
          $puaBefore = [int](Get-MpPreference).PUAProtection
          .\harden.ps1 -DryRun
          $after = (Get-SmbServerConfiguration).RequireSecuritySignature
          if ($before -ne $after) { throw "dry run changed SMB signing: $before -> $after" }
          $wd = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest' -Name UseLogonCredential).UseLogonCredential
          if ($wd -ne 1) { throw "dry run changed WDigest to $wd" }
          $csv = "$env:TEMP\dry-audit.csv"
          auditpol /backup /file:$csv | Out-Null
          $logonRow = (Get-Content $csv | Select-String '0cce9215' | Select-Object -First 1).Line
          Remove-Item $csv
          if (($logonRow -split ',')[-1] -ne '0') { throw "dry run changed the Logon audit subcategory: $logonRow" }
          $ar = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer' -Name NoDriveTypeAutoRun).NoDriveTypeAutoRun
          if ($ar -ne 0x91) { throw "dry run changed NoDriveTypeAutoRun to $ar" }
          if ((Get-Service Spooler).Status -ne 'Running') { throw "dry run stopped the Spooler" }
          $ra = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Lsa' -Name RestrictAnonymous).RestrictAnonymous
          if ($ra -ne 0) { throw "dry run changed RestrictAnonymous to $ra" }
          $puaAfter = [int](Get-MpPreference).PUAProtection
          if ($puaAfter -ne $puaBefore) { throw "dry run changed Defender PUAProtection: $puaBefore -> $puaAfter" }
          if (-not (Get-SmbServerConfiguration).EnableSMB1Protocol) { throw "dry run disabled the planted SMB1 dialect" }
          "dry run left the planted offenders alone"

      - name: "First pass: harden the node for real"
        shell: powershell
        run: .\harden.ps1 -Yes

      # A correct second pass must find nothing to do. The script counts real
      # changes, so the contract is machine-checkable without hashing files.
      - name: "Second pass: idempotence (zero changes)"
        shell: powershell
        run: |
          $out = .\harden.ps1 -Yes | Out-String
          $out
          if ($out -notmatch 'Changes applied:\s*0\b') {
            throw "harden.ps1 is not idempotent - the second pass reported changes"
          }
          "Idempotent: the second pass applied 0 changes."

      - name: Verify every promise
        shell: powershell
        run: .\test\verify.ps1

      - name: Score the box
        shell: powershell
        run: .\test\audit.ps1

      # Every -No<Step> switch, one per step: the skipped step leaves its knob
      # as planted, the rest of the baseline still applies, and a closing full
      # run repairs every plant (so the box also leaves as hardened as it
      # arrived). Replaces the two hand-rolled flag-behaviour checks.
      - name: Scenario tests (every -No* switch)
        shell: powershell
        run: .\test\scenarios.ps1
