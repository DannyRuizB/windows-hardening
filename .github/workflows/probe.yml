name: probe

# Ground truth before promises. This job asks the disposable Windows runner
# which hardening primitives actually WORK there, so every step in harden.ps1
# is written against measured behaviour instead of assumptions — the same rule
# that decided /proc hidepid in the Linux siblings.
#
# It changes nothing: every probe is a read, or a write into a scratch registry
# key it creates and deletes itself. Temporary — it goes away once the real
# e2e job covers the same ground.
on:
  workflow_dispatch:
  push:
    branches: [probe/**]

permissions:
  contents: read

jobs:
  capabilities:
    name: What can we actually harden here?
    runs-on: windows-latest
    steps:
      - name: Who am I and what is this box
        shell: powershell
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "OS caption : $($os.Caption)"
          "OS version : $($os.Version)"
          "PS version : $($PSVersionTable.PSVersion)"
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          $p = New-Object Security.Principal.WindowsPrincipal($id)
          "User       : $($id.Name)"
          "Elevated   : $($p.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"

      - name: Registry write (the workhorse of every step)
        shell: powershell
        run: |
          $k = 'HKLM:\SOFTWARE\WinHardenProbe'
          try {
            New-Item -Path $k -Force | Out-Null
            New-ItemProperty -Path $k -Name Probe -Value 1 -PropertyType DWord -Force | Out-Null
            $v = (Get-ItemProperty -Path $k -Name Probe).Probe
            "HKLM write : OK (read back $v)"
          } catch { "HKLM write : FAILED - $($_.Exception.Message)" }
          finally { Remove-Item -Path $k -Recurse -Force -ErrorAction SilentlyContinue }

      - name: SMB server configuration (SMB1, signing)
        shell: powershell
        run: |
          try {
            $c = Get-SmbServerConfiguration
            "SMB1 enabled          : $($c.EnableSMB1Protocol)"
            "RequireSecuritySignature: $($c.RequireSecuritySignature)"
            "EnableSecuritySignature : $($c.EnableSecuritySignature)"
          } catch { "Get-SmbServerConfiguration FAILED: $($_.Exception.Message)" }
          try {
            $f = Get-WindowsOptionalFeature -Online -FeatureName SMB1Protocol -ErrorAction Stop
            "SMB1 optional feature : $($f.State)"
          } catch { "Get-WindowsOptionalFeature SMB1: $($_.Exception.Message)" }

      - name: Current values of the candidate registry knobs
        shell: powershell
        run: |
          $probes = @(
            @{ Name='WDigest UseLogonCredential'; Path='HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest'; Prop='UseLogonCredential' },
            @{ Name='LLMNR EnableMulticast';      Path='HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\DNSClient'; Prop='EnableMulticast' },
            @{ Name='LmCompatibilityLevel';       Path='HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'; Prop='LmCompatibilityLevel' },
            @{ Name='NoLMHash';                   Path='HKLM:\SYSTEM\CurrentControlSet\Control\Lsa'; Prop='NoLMHash' },
            @{ Name='RDP UserAuthentication';     Path='HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'; Prop='UserAuthentication' },
            @{ Name='RDP SecurityLayer';          Path='HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp'; Prop='SecurityLayer' },
            @{ Name='ScriptBlockLogging';         Path='HKLM:\SOFTWARE\Policies\Microsoft\Windows\PowerShell\ScriptBlockLogging'; Prop='EnableScriptBlockLogging' },
            @{ Name='NoDriveTypeAutoRun';         Path='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'; Prop='NoDriveTypeAutoRun' },
            @{ Name='UAC EnableLUA';              Path='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'; Prop='EnableLUA' },
            @{ Name='UAC ConsentPromptAdmin';     Path='HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'; Prop='ConsentPromptBehaviorAdmin' }
          )
          foreach ($p in $probes) {
            $val = try { (Get-ItemProperty -Path $p.Path -Name $p.Prop -ErrorAction Stop).$($p.Prop) } catch { '<absent>' }
            "{0,-28}: {1}" -f $p.Name, $val
          }

      - name: NetBIOS over TCP/IP interfaces (Responder surface)
        shell: powershell
        run: |
          $ifs = Get-ChildItem 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces' -ErrorAction SilentlyContinue
          "interfaces: $($ifs.Count)"
          foreach ($i in $ifs) {
            $v = try { (Get-ItemProperty $i.PSPath -Name NetbiosOptions -ErrorAction Stop).NetbiosOptions } catch { '<absent>' }
            "  $($i.PSChildName) NetbiosOptions=$v"
          }

      - name: Firewall profiles
        shell: powershell
        run: |
          try {
            Get-NetFirewallProfile | ForEach-Object {
              "{0,-8} enabled={1} inbound={2} outbound={3}" -f $_.Name, $_.Enabled, $_.DefaultInboundAction, $_.DefaultOutboundAction
            }
          } catch { "Get-NetFirewallProfile FAILED: $($_.Exception.Message)" }

      - name: Audit policy (auditpol) readable and settable?
        shell: powershell
        run: |
          $out = auditpol /get /subcategory:"Logon" 2>&1 | Out-String
          "auditpol get rc=$LASTEXITCODE"
          $out.Trim()
          # Set it to what it likely already is, then read back: proves we can
          # write audit policy without changing the box's posture meaningfully.
          $null = auditpol /set /subcategory:"Logon" /success:enable 2>&1
          "auditpol set rc=$LASTEXITCODE"

      - name: Local password / lockout policy (net accounts, secedit)
        shell: powershell
        run: |
          (net accounts) 2>&1 | Out-String
          "net accounts rc=$LASTEXITCODE"
          $tmp = Join-Path $env:TEMP 'probe-sec.inf'
          secedit /export /cfg $tmp /quiet 2>&1 | Out-Null
          "secedit export rc=$LASTEXITCODE exists=$(Test-Path $tmp)"
          if (Test-Path $tmp) {
            Select-String -Path $tmp -Pattern 'MinimumPasswordLength|PasswordHistorySize|LockoutBadCount' | ForEach-Object { "  $($_.Line.Trim())" }
            Remove-Item $tmp -Force
          }

      - name: Defender present and settable?
        shell: powershell
        run: |
          try {
            $mp = Get-MpPreference
            "PUAProtection            : $($mp.PUAProtection)"
            "DisableRealtimeMonitoring: $($mp.DisableRealtimeMonitoring)"
            "MAPSReporting            : $($mp.MAPSReporting)"
          } catch { "Get-MpPreference FAILED: $($_.Exception.Message)" }
          try {
            $s = Get-Service WinDefend -ErrorAction Stop
            "WinDefend service: $($s.Status)"
          } catch { "WinDefend service: $($_.Exception.Message)" }

      - name: PSScriptAnalyzer available?
        shell: powershell
        run: |
          $m = Get-Module -ListAvailable PSScriptAnalyzer
          if ($m) { "PSScriptAnalyzer: $($m[0].Version) (preinstalled)" }
          else { "PSScriptAnalyzer: not preinstalled — CI will install it" }
